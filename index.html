<style>

#ms7boot .pl-bar i{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,#9BCB2C,var(--pl-lime),#E4FFA0);transform-origin:left;transform:scaleX(.04);transition:transform .5s cubic-bezier(.22,1,.36,1)}
#ms7boot .pl-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);width:40%;animation:pl-shine 1.6s ease-in-out infinite}
