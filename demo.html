<script>
(function(){
window.ms7Push={reg:null,installEvt:null,
  supported:'Notification' in window,
  permission:function(){return 'Notification' in window?Notification.permission:'unsupported';},
  standalone:function(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;},
  ask:function(){if(!('Notification' in window))return Promise.resolve('unsupported');return Notification.requestPermission();},
  show:function(title,body,tag){if(!('Notification' in window)||Notification.permission!=='granted')return;var o={body:body,icon:'icon-192.png',badge:'icon-192.png',tag:tag};
    if(this.reg&&this.reg.showNotification)this.reg.showNotification(title,o);else try{new Notification(title,o);}catch(e){}},
  server:function(){return localStorage.getItem('ms7-push-server')||(location.protocol.indexOf('http')===0?location.origin:'');},
  apiKey:function(){return '';},
  hdr:function(){return {'Content-Type':'application/json','Authorization':'Bearer '+(localStorage.getItem('ms7-token')||'')};},
  b64:function(s){var p='='.repeat((4-s.length%4)%4);var b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));var a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;},
  subscribe:function(role){var self=this,base=this.server();if(!this.reg||!this.reg.pushManager)return Promise.reject(new Error('Navegador sem suporte a push'));
    return fetch(base+'/api/push/public-key').then(function(r){if(!r.ok)throw new Error('Servidor não respondeu');return r.json();}).then(function(k){return self.reg.pushManager.getSubscription().then(function(s){return s||self.reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:self.b64(k.publicKey)});});})
    .then(function(sub){return fetch(base+'/api/push/subscribe',{method:'POST',headers:self.hdr(),body:JSON.stringify({subscription:sub,device:navigator.userAgent.slice(0,80)})}).then(function(r){if(!r.ok)throw new Error('Inscrição recusada ('+r.status+')');localStorage.setItem('ms7-push-on','1');return r.json();});});},
  isRemote:function(){return localStorage.getItem('ms7-push-on')==='1';},
  remote:function(title,body,tag){if(!localStorage.getItem('ms7-token')||!this.server())return false;fetch(this.server()+'/api/push/notify',{method:'POST',headers:this.hdr(),body:JSON.stringify({title:title,body:body,tag:tag,url:'./index.html'})}).catch(function(){});return true;},
  install:function(){var e=this.installEvt;if(!e)return Promise.resolve(false);e.prompt();return e.userChoice.then(function(c){return c.outcome==='accepted';});}};
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(function(r){ms7Push.reg=r;}).catch(function(){});}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();ms7Push.installEvt=e;window.dispatchEvent(new Event('ms7-installable'));});
})();
</script>
